# ============================================================================
# GitHub Actions Workflow: Nightly Regression
# Full Grid run on Chrome + Firefox, Allure report published to GitHub Pages.
#
# One-time manual setup required for the Pages deploy step to work:
# after this workflow's first successful run creates the gh-pages branch,
# go to Settings > Pages > Build and deployment > Source, and select the
# gh-pages branch. This cannot be done from within the repo/workflow itself.
# ============================================================================

name: Nightly Regression

on:
  # schedule:
  #   - cron: "0 2 * * *" # 02:00 UTC
  workflow_dispatch: {}

jobs:
  regression-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Start full Grid (Chrome + Firefox)
        run: docker compose up -d selenium-hub chrome firefox

      - name: Wait for Grid hub to be ready
        run: |
          timeout 60 sh -c \
            'until curl -sf http://localhost:4444/wd/hub/status | grep -Eq "\"ready\":[[:space:]]*true"; do sleep 2; done'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run web suite on Chrome
        run: |
          robot --variable REMOTE_URL:http://localhost:4444/wd/hub \
                --variable BROWSER:chrome \
                --listener allure_robotframework:reports/allure-results/web \
                --outputdir reports/web \
                web

      - name: Run api suite (no browser needed)
        run: |
          robot --listener allure_robotframework:reports/allure-results/api \
                --outputdir reports/api \
                api

      - name: Run web suite on Firefox (cross-browser regression pass)
        run: |
          robot --variable REMOTE_URL:http://localhost:4444/wd/hub \
                --variable BROWSER:firefox \
                --listener allure_robotframework:reports/allure-results/web-firefox \
                --outputdir reports/web-firefox \
                web

      - name: Tear down Grid
        if: always()
        run: docker compose down -v

      - name: Set up JRE for the Allure CLI
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure CLI
        if: always()
        run: |
          curl -fsSL https://github.com/allure-framework/allure2/releases/download/2.44.0/allure-2.44.0.tgz \
            -o /tmp/allure.tgz
          sudo tar -xzf /tmp/allure.tgz -C /opt
          sudo ln -s /opt/allure-2.44.0/bin/allure /usr/local/bin/allure

      - name: Generate combined Allure report
        if: always()
        run: allure generate reports/allure-results --clean -o reports/allure-report

      - name: Upload Allure report artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-allure-report
          path: reports/allure-report/
          retention-days: 30

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: reports/allure-report

  notify-on-failure:
    needs: regression-grid
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open a failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly regression failed - ${today}`,
              body: `Nightly regression run failed. See run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["ci-failure", "nightly"]
            });
