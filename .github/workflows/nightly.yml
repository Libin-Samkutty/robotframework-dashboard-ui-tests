# ============================================================================
# GitHub Actions Workflow: Nightly Regression
# Full Grid run on Chrome + Firefox, Allure report published to GitHub Pages.
#
# One-time manual setup required for the Pages deploy step to work:
# after this workflow's first successful run creates the gh-pages branch,
# go to Settings > Pages > Build and deployment > Source, and select the
# gh-pages branch. This cannot be done from within the repo/workflow itself.
# ============================================================================

name: Nightly Regression

on:
  # schedule:
  #   - cron: "0 2 * * *" # 02:00 UTC
  workflow_dispatch: {}

jobs:
  regression-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for docker compose
        run: cp .env.example .env
        # docker compose validates env_file for every service in the compose
        # file (not just the ones being started), so `docker compose down`
        # fails without this even though the robot-tests service is never
        # started via `up` here - no secrets involved, this is the same
        # placeholder-only file from .env.example (see ci.yml).

      - name: Build robot-tests image from the Dockerfile
        run: docker compose build robot-tests

      - name: Start full Grid (Chrome + Firefox)
        run: docker compose up -d selenium-hub chrome firefox

      - name: Wait for Grid hub to be ready
        run: |
          timeout 60 sh -c \
            'until curl -sf http://localhost:4444/wd/hub/status | grep -Eq "\"ready\":[[:space:]]*true"; do sleep 2; done'

      - name: Run web suite on Chrome (parallel via pabot, inside the Dockerfile image)
        run: |
          docker compose run --rm --no-deps robot-tests \
            pabot --testlevelsplit --pabotlib --processes 3 \
                  --variable REMOTE_URL:http://selenium-hub:4444/wd/hub \
                  --variable BROWSER:chrome \
                  --listener allure_robotframework:reports/allure-results/web \
                  --outputdir reports/web \
                  web

      - name: Run api suite (parallel via pabot, no browser needed)
        run: |
          docker compose run --rm --no-deps robot-tests \
            pabot --testlevelsplit --pabotlib --processes 3 \
                  --listener allure_robotframework:reports/allure-results/api \
                  --outputdir reports/api \
                  api

      - name: Run web suite on Firefox (cross-browser regression pass, parallel via pabot)
        run: |
          docker compose run --rm --no-deps robot-tests \
            pabot --testlevelsplit --pabotlib --processes 3 \
                  --variable REMOTE_URL:http://selenium-hub:4444/wd/hub \
                  --variable BROWSER:firefox \
                  --listener allure_robotframework:reports/allure-results/web-firefox \
                  --outputdir reports/web-firefox \
                  web

      - name: Tear down Grid
        if: always()
        run: docker compose down -v

      - name: Generate combined Allure report (inside the Dockerfile image)
        if: always()
        run: |
          # allure generate only reads *-result.json files directly inside
          # each directory it's given - it does not recurse into
          # subdirectories. The three suites above each write into their own
          # subdirectory (reports/allure-results/{web,api,web-firefox}), so
          # all three must be passed explicitly or the combined report comes
          # out empty.
          docker compose run --rm --no-deps robot-tests \
            allure generate reports/allure-results/web reports/allure-results/api reports/allure-results/web-firefox \
              --clean -o reports/allure-report

      - name: Upload Allure report artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-allure-report
          path: reports/allure-report/
          retention-days: 30

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: reports/allure-report

  notify-on-failure:
    needs: regression-grid
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open a failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly regression failed - ${today}`,
              body: `Nightly regression run failed. See run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["ci-failure", "nightly"]
            });
