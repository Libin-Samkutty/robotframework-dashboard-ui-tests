# ============================================================================
# Docker Compose Configuration - Selenium Grid + Robot Framework + Allure
# ============================================================================

services:
  selenium-hub:
    image: selenium/hub:4.45.0
    container_name: selenium-hub
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/wd/hub/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  chrome:
    image: selenium/node-chrome:4.45.0
    shm_size: 2gb
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 3

  firefox:
    image: selenium/node-firefox:4.45.0
    shm_size: 2gb
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 3

  robot-tests:
    build:
      context: .
      dockerfile: Dockerfile
    # No fixed container_name: CI invokes this service multiple times per job
    # via `docker compose run` (ordering, pabot, allure generate) - a static
    # name would risk a "name already in use" conflict between those calls if
    # a prior one didn't clean up in time.
    depends_on:
      selenium-hub:
        condition: service_healthy
      chrome:
        condition: service_started
      firefox:
        condition: service_started
    env_file:
      - .env
    environment:
      REMOTE_URL: http://selenium-hub:4444/wd/hub
      BASE_URL: https://practice.expandtesting.com
      ROBOT_LIBRARY_SCOPE: GLOBAL
      TZ: UTC
    volumes:
      - ./reports:/app/reports
      - ./web:/app/web:ro
      - ./api:/app/api:ro
      - ./shared:/app/shared:ro
      - ./.pabot-history:/app/.pabot-history
    command: >
      robot
      --variable REMOTE_URL:http://selenium-hub:4444/wd/hub
      --variable BROWSER:chrome
      --listener allure_robotframework:reports/allure-results
      --outputdir reports
      web api
    stdin_open: false
    tty: false
